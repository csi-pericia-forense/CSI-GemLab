<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI GemLab - Consulta de Laudos Forenses</title>
    
    <!-- Fontes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta de Cores Neon */
            --bg-dark: #05070c;
            --accent-yellow: #ffe600;
            --accent-yellow-glow: rgba(255, 230, 0, 0.5);
            --accent-blue: #00f3ff;
            --accent-blue-glow: rgba(0, 243, 255, 0.5);
            --text-main: #ffffff;
            --glass-bg: rgba(10, 15, 30, 0.65);
            --glass-border: rgba(0, 243, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            /* Fundo com degradê e partículas sutis */
            background-image: 
                radial-gradient(circle at 50% 40%, rgba(10, 25, 45, 0.8) 0%, var(--bg-dark) 70%),
                linear-gradient(135deg, rgba(10, 15, 30, 0.3) 0%, transparent 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Cursor personalizado */
            cursor: crosshair;
        }

        /* Partículas de fundo decorativas */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
            z-index: -1;
        }

        /* Container Principal (Card) */
        .wrapper {
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInScale 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-blue-glow);
            text-align: center;
            position: relative;
        }

        /* Linha de escaneamento de borda */
        .card::after {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, var(--accent-blue), transparent 50%, var(--accent-yellow), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: borderRotate 6s linear infinite;
            opacity: 0.7;
        }

        /* Logo / Escudo CSI (Embutido em SVG) */
        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .csi-shield {
            width: 50px;
            height: 50px;
            /* Cor do SVG inicial (azul) */
            fill: var(--accent-blue);
            /* Brilho neon no logo */
            filter: drop-shadow(0 0 8px var(--accent-blue-glow));
            animation: pulseBlue 3s infinite alternate;
        }

        .brand-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            text-shadow: 0 0 15px var(--accent-blue-glow);
            text-transform: uppercase;
        }

        /* Título da ação */
        .card label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 18px;
            text-shadow: 0 0 10px var(--accent-yellow-glow);
            text-transform: uppercase;
        }

        /* Área de Input e Botão */
        .input-action-group {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-blue-glow);
            background: rgba(2, 6, 23, 1);
        }

        button {
            padding: 16px 32px;
            /* Degradê inicial do botão */
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px var(--accent-blue-glow);
        }

        /* Efeito Hover no botão (Muda para Amarelo Neon) */
        button:hover {
            background: var(--accent-yellow);
            color: #000; /* Texto preto no amarelo */
            border-color: var(--accent-yellow);
            box-shadow: 0 0 30px var(--accent-yellow-glow);
            transform: translateY(-2px);
            animation: pulseYellow 0.5s infinite alternate;
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 0 10px var(--accent-yellow-glow);
        }

        /* Mensagens de Status Estilizadas */
        #mensagem-status {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 500;
            min-height: 25px;
            letter-spacing: 0.5px;
            transition: opacity 0.4s ease;
            padding: 0 10px;
        }

        .status-erro {
            color: #ff4444;
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.6);
        }

        .status-sucesso {
            color: var(--accent-blue);
            text-shadow: 0 0 8px var(--accent-blue-glow);
        }

        .status-info {
            color: var(--accent-yellow);
            text-shadow: 0 0 8px var(--accent-yellow-glow);
        }

        /* Animações */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseBlue {
            from { filter: drop-shadow(0 0 5px var(--accent-blue-glow)); fill: var(--accent-blue); }
            to { filter: drop-shadow(0 0 15px var(--accent-blue-glow)); fill: #66faff; }
        }

        @keyframes pulseYellow {
            from { box-shadow: 0 0 15px var(--accent-yellow-glow); }
            to { box-shadow: 0 0 30px var(--accent-yellow-glow); }
        }

        @keyframes borderRotate {
            from { background-position: 0% 0%; }
            to { background-position: 400% 0%; }
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua pelos seus dados reais)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_DOMINIO.firebaseapp.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_BUCKET.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function consultarLaudo() {
            const tokenInput = document.getElementById("token");
            const statusDiv = document.getElementById("mensagem-status");
            const token = tokenInput.value.trim();

            if (token === "") {
                statusDiv.className = "status-erro";
                statusDiv.innerText = "⚠️ ERRO CRÍTICO: Token de consulta não pode estar vazio.";
                tokenInput.focus();
                return;
            }

            // Feedback de processamento (em amarelo neon)
            statusDiv.className = "status-info";
            statusDiv.innerText = "📡 TRANSMISSÃO INICIADA: Localizando registro criptografado...";
            statusDiv.style.opacity = "1";

            db.collection("laudos").doc(token).get().then((doc) => {
                if (doc.exists) {
                    // Feedback de sucesso (em azul neon)
                    statusDiv.className = "status-sucesso";
                    statusDiv.innerText = "✅ ACESSO AUTORIZADO: Laudo validado. Redirecionando sistema...";
                    statusDiv.style.opacity = "1";
                    
                    setTimeout(() => {
                        window.location.href = doc.data().url;
                    }, 800); // Pequeno atraso para ler a msg de sucesso
                } else {
                    // Feedback de erro (em vermelho)
                    statusDiv.className = "status-erro";
                    statusDiv.innerText = "❌ FALHA NA AUTENTICAÇÃO: Token não encontrado na base de dados.";
                    statusDiv.style.opacity = "1";
                }
            }).catch((error) => {
                statusDiv.className = "status-erro";
                statusDiv.innerText = "⚠️ FALHA DE SISTEMA: Erro de conexão com o servidor central.";
                statusDiv.style.opacity = "1";
                console.error("Erro Firebase:", error);
            });
        }

        // Adicionar funcionalidade de "Enter" no input
        document.addEventListener("DOMContentLoaded", () => {
            const inputField = document.getElementById("token");
            inputField.addEventListener("keypress", (event) => {
                if (event.key === "Enter") {
                    consultarLaudo();
                }
            });
            // Focar automaticamente no input ao carregar a página
            inputField.focus();
        });
    </script>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <!-- Logo / Escudo CSI (Vetorial SVG Embutido - Não quebra!) -->
            <div class="logo-box">
                <svg class="csi-shield" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <h1 class="brand-title">CSI GemLab</h1>
            </div>

            <label for="token">INSERIR TOKEN DE CONSULTA FORENSE</label>
            
            <div class="input-action-group">
                <input id="token" type="text" placeholder="Ex: AB123456
