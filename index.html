<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSI GemLab - Consulta de Laudos Forenses</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-yellow: #ffe600;
            --accent-yellow-glow: rgba(255, 230, 0, 0.5);
            --accent-blue: #00f3ff;
            --accent-blue-glow: rgba(0, 243, 255, 0.5);
            --text-main: #ffffff;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 243, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fundo 100% transparente para sumir com qualquer box externo ou fundo indesejado */
        html, body {
            background: transparent !important;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px; 
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 20px; /* Reduzido ainda mais na vertical */
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-blue-glow);
            text-align: center;
            position: relative;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .csi-shield {
            width: 28px;
            height: 28px;
            fill: var(--accent-blue);
            filter: drop-shadow(0 0 6px var(--accent-blue-glow));
        }

        .brand-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--accent-blue-glow);
            text-transform: uppercase;
        }

        .card label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 6px;
            text-shadow: 0 0 8px var(--accent-yellow-glow);
            text-transform: uppercase;
        }

        .input-action-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 9px 14px;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px var(--accent-blue-glow);
        }

        button {
            padding: 9px 18px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: #fff;
            border: 1px solid var(--accent-blue);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            box-shadow: 0 0 12px var(--accent-blue-glow);
        }

        button:hover {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 20px var(--accent-yellow-glow);
        }

        #mensagem-status {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 500;
            min-height: 16px;
        }

        .status-erro { color: #ff4444; text-shadow: 0 0 6px rgba(255, 68, 68, 0.6); }
        .status-sucesso { color: var(--accent-blue); text-shadow: 0 0 6px var(--accent-blue-glow); }
        .status-info { color: var(--accent-yellow); text-shadow: 0 0 6px var(--accent-yellow-glow); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_DOMINIO.firebaseapp.com",
            projectId: "SUA_PROJECT_ID",
            storageBucket: "SEU_BUCKET.appspot.com",
            messagingSenderId: "SUA_SENDER_ID",
            appId: "SUA_APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function consultarLaudo() {
            const tokenInput = document.getElementById("token");
            const statusDiv = document.getElementById("mensagem-status");
            const token = tokenInput.value.trim();

            if (token === "") {
                statusDiv.className = "status-erro";
                statusDiv.innerText = "⚠️ ERRO: Token não pode estar vazio.";
                return;
            }

            statusDiv.className = "status-info";
            statusDiv.innerText = "📡 Localizando registro criptografado...";

            db.collection("laudos").doc(token).get().then((doc) => {
                if (doc.exists) {
                    statusDiv.className = "status-sucesso";
                    statusDiv.innerText = "✅ Laudo validado. Redirecionando...";
                    setTimeout(() => { window.location.href = doc.data().url; }, 800);
                } else {
                    statusDiv.className = "status-erro";
                    statusDiv.innerText = "❌ Token não encontrado na base de dados.";
                }
            }).catch(() => {
                statusDiv.className = "status-erro";
                statusDiv.innerText = "⚠️ Erro de conexão com o servidor.";
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const inputField = document.getElementById("token");
            inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") consultarLaudo(); });
        });
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo-box">
                <svg class="csi-shield" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
                <h1 class="brand-title">CSI GemLab</h1>
            </div>
            <label for="token">Inserir Token de Consulta</label>
            <div class="input-action-group">
                <input id="token" type="text" placeholder="Ex: AB12345" autocomplete="off">
                <button onclick="consultarLaudo()">Consultar</button>
            </div>
            <div id="mensagem-status"></div>
        </div>
    </div>
</body>
</html>
