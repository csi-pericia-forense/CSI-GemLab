<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSI GEMLAB · PERÍCIA GEMOLÓGICA FORENSE</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #00aaff;
      text-shadow: 0 0 10px #00aaff;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      color: #ffd700;
      margin-bottom: 30px;
    }

    .input-area {
      margin-top: 30px;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      border: 2px solid #00aaff;
      border-radius: 10px;
      box-shadow: 0 0 10px #00aaff;
    }

    .input-area input {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      border: 2px solid #00aaff;
      background: transparent;
      color: #fff;
      outline: none;
      box-shadow: 0 0 6px #0077aa;
    }

    .input-area button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      background: #ffd700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #ffd700;
      transition: 0.2s;
    }

    .input-area button:hover {
      background: #ffea4d;
      box-shadow: 0 0 14px #ffea4d;
    }

    #resultado {
      margin-top: 20px;
      font-size: 18px;
      color: #fff;
      text-shadow: 0 0 6px #00aaff;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>CSI GEMLAB · PERÍCIA GEMOLÓGICA FORENSE</h1>
  <h2>Blindagem Patrimonial & Certificação Gemológica</h2>

  <div class="input-area">
    <label>RASTREAR CERTIFICADO / LAUDO OFICIAL</label><br><br>
    <input id="campoToken" placeholder="Ex: CSI-DATA-HHMMSS-TESTE">
    <button onclick="buscarLaudo()">CONSULTAR</button>
  </div>

  <div id="resultado"></div>
</div>

<script>
async function buscarLaudo() {
    const tokenDigitado = document.getElementById("campoToken").value.trim();

    if (!tokenDigitado) {
        document.getElementById("resultado").innerHTML = "Digite o token.";
        return;
    }

    document.getElementById("resultado").innerHTML = "Acessando Base de Dados Forense...";

    const categorias = ["patrimonial", "viabilidade"];
    const pastas = ["01_CSI-000", "01_CSI-000-V"];

    for (const categoria of categorias) {
        for (const pasta of pastas) {
            try {
                const caminho = `/CSI-GemLab/${categoria}/${pasta}/token/token.csi`;

                const resposta = await fetch(caminho);

                if (!resposta.ok) continue;

                const tokenArquivo = (await resposta.text()).trim();

                if (tokenArquivo === tokenDigitado) {
                    window.location.href = `/CSI-GemLab/${categoria}/${pasta}/pagina_01/pagina_01.html?token=${tokenDigitado}`;
                    return;
                }
            } catch (e) {}
        }
    }

    document.getElementById("resultado").innerHTML = "Nenhum laudo encontrado.";
}
</script>

</body>
</html>
