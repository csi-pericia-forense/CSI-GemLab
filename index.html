<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CSI GemLab - Consulta</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #0b0b0b;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    .header {
        background-color: #0a3d62;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    .header img {
        height: 70px;
    }

    .container {
        margin-top: 60px;
    }

    input {
        padding: 12px;
        width: 260px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
    }

    button {
        padding: 12px 25px;
        background-color: #0984e3;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        margin-left: 10px;
    }

    button:hover {
        background-color: #74b9ff;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_DOMINIO.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_BUCKET.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function consultarLaudo() {
        const token = document.getElementById("token").value.trim();

        if (token === "") {
            alert("Digite um token válido.");
            return;
        }

        db.collection("laudos").doc(token).get().then((doc) => {
            if (doc.exists) {
                window.location.href = doc.data().url;
            } else {
                alert("Token não encontrado.");
            }
        });
    }
</script>

</head>

<body>

<div class="header">
    <img src="https://i.imgur.com/8Yq7ZQk.png" alt="CSI Logo">
    <h1>CSI Perícia</h1>
</div>

<div class="container">
    <label for="token">Insira o token do laudo:</label><br><br>
    <input id="token" type="text" placeholder="Ex: AB12345">
    <button onclick="consultarLaudo()">Consultar</button>
</div>

</body>
</html>
