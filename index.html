<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSI GemLab – Consulta</title>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    /* BANNER FINO E PROFISSIONAL */
    .banner {
      width: 100%;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;

      /* Borda neon fina */
      border-bottom: 2px solid #00aaff;
      box-shadow: 0 0 6px #00aaff;

      /* Fundo totalmente transparente */
      background: transparent;
    }

    .banner label {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 0 6px #00aaff;
    }

    .banner input {
      padding: 8px;
      font-size: 15px;
      border-radius: 5px;
      border: 2px solid #00aaff;
      background: transparent;
      color: #fff;
      width: 200px;
      outline: none;
      box-shadow: 0 0 6px #0077aa;
    }

    .banner button {
      padding: 8px 16px;
      font-size: 15px;
      background: #00aaff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #00aaff;
      transition: 0.2s;
    }

    .banner button:hover {
      background: #33cfff;
      box-shadow: 0 0 14px #33cfff;
    }

    /* Resultado – também transparente */
    #resultado {
      margin-top: 15px;
      padding: 10px;
      font-size: 15px;
      color: #fff;
      background: transparent;
      border-left: 3px solid #00aaff;
    }
  </style>
</head>

<body>

<div class="banner">
  <label>Insira o token do laudo:</label>
  <input id="campoToken" placeholder="Ex: AB12345">
  <button onclick="buscarLaudo()">Consultar</button>
</div>

<div id="resultado"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCdr899qbxpWUeRzdiTPO9rhnjdLMU8dcU",
    authDomain: "csi-gemlab.firebaseapp.com",
    projectId: "csi-gemlab"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  async function buscarLaudo() {
    const token = document.getElementById("campoToken").value.trim();
    const ref = db.collection("laudos").where("token", "==", token);
    const resultado = await ref.get();

    if (resultado.empty) {
      document.getElementById("resultado").innerHTML = "Nenhum laudo encontrado.";
      return;
    }

    resultado.forEach(doc => {
      const d = doc.data();

      /* Redireciona para a página da gema (pasta 1) */
      window.location.href = d.link_pasta_1;
    });
  }
</script>

</body>
</html>
