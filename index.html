<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CSI GemLab - Consulta</title>

    <!-- Ajuste para Webnode (remove espaço gigante no topo) -->
    <style>
        body {
            margin: 0;
            padding: 0 !important;
        }

        #wn-container,
        .wn-content,
        .wn-section {
            padding-top: 0 !important;
            margin-top: 0 !important;
        }

        /* Sobe o header azul */
        .header {
            background-color: #0a3d62;
            color: white;
            padding: 15px 20px;
            margin-top: 0 !important;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header img {
            height: 60px;
        }

        .container {
            margin-top: 40px;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #0984e3;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #74b9ff;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_DOMINIO.firebaseapp.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_BUCKET.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function consultarLaudo() {
            const token = document.getElementById("token").value.trim();

            if (token === "") {
                alert("Digite um token válido.");
                return;
            }

            db.collection("laudos").doc(token).get().then((doc) => {
                if (doc.exists) {
                    window.location.href = doc.data().url;
                } else {
                    alert("Token não encontrado.");
                }
            });
        }
    </script>
</head>

<body>

    <div class="header">
        <img src="https://i.imgur.com/8Yq7ZQk.png" alt="CSI Logo">
        <h1>CSI Perícia</h1>
    </div>

    <div class="container">
        <label for="token">Insira o token do laudo:</label><br><br>
        <input id="token" type="text" placeholder="Ex: AB12345">
        <button onclick="consultarLaudo()">Consultar</button>
    </div>

</body>
</html>
