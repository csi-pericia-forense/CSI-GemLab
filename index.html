<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CSI GemLab - Consulta</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top left, #00111a, #000000);
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #d9eaff;
        text-align: center;
        overflow-x: hidden;
    }

    /* HEADER FUTURISTA */
    .header {
        background: rgba(0, 40, 70, 0.6);
        backdrop-filter: blur(12px);
        padding: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        border-bottom: 2px solid #00aaff;
        box-shadow: 0 0 25px #0088ff;
        animation: glowHeader 3s infinite alternate;
    }

    @keyframes glowHeader {
        from { box-shadow: 0 0 15px #005577; }
        to { box-shadow: 0 0 35px #00aaff; }
    }

    .header img {
        height: 85px;
        filter: drop-shadow(0 0 10px #00aaff);
    }

    .header h1 {
        font-size: 32px;
        letter-spacing: 2px;
        text-shadow: 0 0 12px #00aaff;
    }

    /* CONTAINER */
    .container {
        margin-top: 80px;
        font-size: 22px;
        animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* INPUT FUTURISTA */
    input {
        padding: 14px;
        width: 300px;
        font-size: 18px;
        border-radius: 10px;
        border: 2px solid #00aaff;
        background: rgba(0, 20, 40, 0.7);
        color: #d9eaff;
        outline: none;
        box-shadow: 0 0 12px #005577;
        transition: 0.3s;
    }

    input:focus {
        box-shadow: 0 0 18px #00aaff;
        border-color: #00ccff;
    }

    /* BOTÃO NEON */
    button {
        padding: 14px 30px;
        background: linear-gradient(90deg, #00aaff, #00ffcc);
        color: #00111a;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        margin-left: 10px;
        box-shadow: 0 0 15px #00aaff;
        transition: 0.3s;
    }

    button:hover {
        box-shadow: 0 0 25px #00ffcc;
        transform: scale(1.05);
    }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_DOMINIO.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_BUCKET.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function consultarLaudo() {
        const token = document.getElementById("token").value.trim();

        if (token === "") {
            alert("Digite um token válido.");
            return;
        }

        db.collection("laudos").doc(token).get().then((doc) => {
            if (doc.exists) {
                window.location.href = doc.data().url;
            } else {
                alert("Token não encontrado.");
            }
        });
    }
</script>

</head>

<body>

<div class="header">
    <img src="https://i.imgur.com/8Yq7ZQk.png" alt="CSI Logo">
    <h1>CSI Perícia</h1>
</div>

<div class="container">
    <label for="token">Insira o token do laudo:</label><br><br>
    <input id="token" type="text" placeholder="Ex: AB12345">
    <button onclick="consultarLaudo()">Consultar</button>
</div>

</body>
</html>
