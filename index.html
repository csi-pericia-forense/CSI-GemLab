<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CSI GemLab - Consulta</title>

    <!-- Ajuste para Webnode (remove espaço gigante no topo) -->
    <style>
/* Remove a barra lateral azul do Webnode */
#wn-sidebar,
.wn-sidebar,
#wn-left,
#wn-left-bar {
    display: none !important;
    visibility: hidden !important;
    width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
}

/* Remove o padding gigante do Webnode */
#wn-container,
#wn-content,
.wn-content,
.wn-section,
#wn-main,
#wn-page {
    margin: 0 !important;
    padding: 0 !important;
}

/* Sobe o header azul do CSI */
.header {
    margin-top: 0 !important;
    padding-top: 5px !important;
}

/* Garante que o site fique colado no topo */
body, html {
    margin: 0 !important;
    padding: 0 !important;
}
</style>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_DOMINIO.firebaseapp.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_BUCKET.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function consultarLaudo() {
            const token = document.getElementById("token").value.trim();

            if (token === "") {
                alert("Digite um token válido.");
                return;
            }

            db.collection("laudos").doc(token).get().then((doc) => {
                if (doc.exists) {
                    window.location.href = doc.data().url;
                } else {
                    alert("Token não encontrado.");
                }
            });
        }
    </script>
</head>

<body>

    <div class="header">
        <img src="https://i.imgur.com/8Yq7ZQk.png" alt="CSI Logo">
        <h1>CSI Perícia</h1>
    </div>

    <div class="container">
        <label for="token">Insira o token do laudo:</label><br><br>
        <input id="token" type="text" placeholder="Ex: AB12345">
        <button onclick="consultarLaudo()">Consultar</button>
    </div>

</body>
</html>
