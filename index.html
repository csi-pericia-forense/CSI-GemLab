<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSI GemLab – Consulta</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .banner {
      width: 100%;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #00aaff;
      box-shadow: 0 0 6px #00aaff;
      background: transparent;
    }

    .banner label {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 0 0 6px #00aaff;
    }

    .banner input {
      padding: 8px;
      font-size: 15px;
      border-radius: 5px;
      border: 2px solid #00aaff;
      background: transparent;
      color: #fff;
      width: 220px;
      outline: none;
      box-shadow: 0 0 6px #0077aa;
    }

    .banner button {
      padding: 8px 16px;
      font-size: 15px;
      background: #00aaff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 10px #00aaff;
      transition: 0.2s;
    }

    .banner button:hover {
      background: #33cfff;
      box-shadow: 0 0 14px #33cfff;
    }

    #resultado {
      margin-top: 15px;
      padding: 10px;
      font-size: 15px;
      color: #fff;
      background: transparent;
      border-left: 3px solid #00aaff;
    }
  </style>
</head>

<body>

<div class="banner">
  <label>Insira o token do laudo:</label>
  <input id="campoToken" placeholder="Ex: CSI-DATA-HHMMSS-TESTE">
  <button onclick="buscarLaudo()">Consultar</button>
</div>

<div id="resultado"></div>

<script>
async function buscarLaudo() {
    const tokenDigitado = document.getElementById("campoToken").value.trim();

    if (!tokenDigitado) {
        document.getElementById("resultado").innerHTML = "Digite o token.";
        return;
    }

    document.getElementById("resultado").innerHTML = "Acessando Base de Dados Forense...";

    // CATEGORIAS PRINCIPAIS
    const categorias = ["patrimonial", "viabilidade"];

    // SUBPASTAS (adicione conforme criar novos laudos)
    const pastas = [
        "01_CSI-000",
        "01_CSI-000-V"
    ];

    // VARREDURA
    for (const categoria of categorias) {
        for (const pasta of pastas) {
            try {
                const caminho = `/${categoria}/${pasta}/token/token.csi`;

                const resposta = await fetch(caminho);

                if (!resposta.ok) continue;

                const tokenArquivo = (await resposta.text()).trim();

                if (tokenArquivo === tokenDigitado) {
                    window.location.href = `/${categoria}/${pasta}/pagina_01/pagina_01.html?token=${tokenDigitado}`;
                    return;
                }
            } catch (e) {
                // ignora erros
            }
        }
    }

    document.getElementById("resultado").innerHTML = "Nenhum laudo encontrado.";
}
</script>

</body>
</html>
