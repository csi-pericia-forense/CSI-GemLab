<script>
async function buscarLaudo() {
    const tokenDigitado = document.getElementById("token-gem").value.trim();

    if (!tokenDigitado) {
        document.getElementById("mensagem-status").innerHTML = "Digite o token.";
        return;
    }

    document.getElementById("mensagem-status").innerHTML = "Procurando token nas pastas...";

    // DIRETÓRIOS RAIZ
    const diretoriosRaiz = ["patrimonial", "viabilidade"];

    for (const raiz of diretoriosRaiz) {

        try {
            // LISTA TODAS AS PASTAS DENTRO DE patrimonial/ OU viabilidade/
            const respostaLista = await fetch(`${raiz}/`);
            const textoLista = await respostaLista.text();

            // EXTRAI NOMES DE PASTAS DO HTML DO GITHUB PAGES
            const regexPastas = /href="([^"]+)\/"/g;
            let match;

            while ((match = regexPastas.exec(textoLista)) !== null) {
                const pasta = match[1];

                // Caminho do token.json dentro da pasta
                const caminhoToken = `${raiz}/${pasta}/token.json`;

                try {
                    const respostaToken = await fetch(caminhoToken);

                    if (!respostaToken.ok) continue;

                    const dados = await respostaToken.json();

                    if (dados.token === tokenDigitado) {
                        // ACHOU O TOKEN
                        const destino = `${raiz}/${pasta}/pagina_01/pagina_01.html?token=${encodeURIComponent(tokenDigitado)}`;
                        window.location.href = destino;
                        return;
                    }

                } catch (e) {
                    console.log("Erro ao ler token.json:", e);
                }
            }

        } catch (e) {
            console.log("Erro ao listar pastas:", e);
        }
    }

    document.getElementById("mensagem-status").innerHTML = "Nenhum laudo encontrado.";
}
</script>
